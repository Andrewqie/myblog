# Pages CMS configuration: https://pagescms.org/docs/configuration/
# Sign in at https://app.pagescms.org with GitHub to edit posts in the browser.

media:
  input: static/images
  output: /myblog/images      # the site lives under /myblog/, so image links need that prefix
  rename: safe
  categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    filename: "{year}-{month}-{day}-{hour}{minute}.md"   # automatic and unique, e.g. 2026-11-17-1933.md
    view:
      fields: [title, date, draft, tags]
      primary: title
      sort: [date, title]
      search: [title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"    # no UTC offset; Hugo applies the site time zone (America/New_York)
        description: Posts older than a year move to the Archive tab automatically.
      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Turn this OFF to publish. While on, the post stays hidden from the site.
      - name: tags
        label: Tags
        type: select
        options:
          multiple: true
          values: [theology, biblical study, personal, opinion, reflection, history]
      - name: author
        type: string
        default: Andrew Qie
        hidden: true
      - name: body
        label: Post (Markdown)
        type: text

  - name: about
    label: About page
    type: file
    path: content/about.md      # no fields listed, so this opens as a plain Markdown file
