{{ $here := .RelPermalink }}
<input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menu">
<label for="nav-toggle" class="nav-button" aria-hidden="true"><span></span></label>
<aside class="sidebar">
  <div class="brand">
    <a class="site-name" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    {{ with .Site.Params.subtitle }}<p class="tagline">{{ . }}</p>{{ end }}
  </div>
  <nav class="menu" aria-label="Main">
    <a href="{{ "/" | relURL }}" {{ if .IsHome }}aria-current="page"{{ end }}>Home</a>
    {{ range .Site.Menus.main }}
    {{ $u := .URL | relURL }}
    <a href="{{ $u }}" {{ if hasPrefix $here $u }}aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
  <div class="skin-picker" aria-label="Colour theme">
    <span>Colours</span>
    <button data-skin-set="paper">Paper</button>
    <button data-skin-set="sage">Sage</button>
    <button data-skin-set="blush">Blush</button>
    <button data-skin-set="dusk">Dusk</button>
  </div>
  <script>
    document.querySelectorAll('[data-skin-set]').forEach(function (b) {
      b.addEventListener('click', function () {
        var s = b.getAttribute('data-skin-set');
        document.documentElement.setAttribute('data-skin', s);
        try { localStorage.setItem('skin', s); } catch (e) {}
      });
    });
  </script>
  <footer class="side-foot">
    {{ dateFormat "2006" now }} {{ .Site.Copyright }}
  </footer>
</aside>
